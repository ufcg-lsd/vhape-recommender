apiVersion: v1
kind: Service
metadata:
  name: vhape-kube-state-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    app: vhape-kube-state-metrics
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    app: vhape-kube-state-metrics
  ports:
    - name: http-metrics
      port: 8080
      targetPort: http-metrics
