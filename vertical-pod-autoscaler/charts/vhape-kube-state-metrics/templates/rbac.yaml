apiVersion: v1
kind: ServiceAccount
metadata:
  name: vhape-kube-state-metrics
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vhape-kube-state-metrics
rules:
  # VPAs whose recommendations are exported.
  - apiGroups:
      - autoscaling.k8s.io
    resources:
      - verticalpodautoscalers
    verbs:
      - list
      - watch

  # Needed by kube-state-metrics to discover the custom resources in the config.
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vhape-kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vhape-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: vhape-kube-state-metrics
    namespace: {{ .Release.Namespace }}
