apiVersion: autoscaling.vhape.io/v1alpha1
kind: VhapePolicy
metadata:
  name: adrs-mem-v2
spec:
  resources:
    cpu:
      percentile-hysteresis:
        percentile: 0.93
        headroom: 0.10
        slidingWindow: 24h
        minimumCoverageWindow: 30m
    memory:
      adrs-mem-v2:
        slidingWindow: 24h
        minimumCoverageWindow: 30m
  scalingRule: ""
