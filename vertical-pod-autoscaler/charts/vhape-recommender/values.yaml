image:
  repository: vtexlsd/vhape-recommender
  tag: ""
  pullPolicy: IfNotPresent

policies:
  - name: vhape-policy-p93-default
    cpu:
      percentile-hysteresis:
        percentile: 0.93
        headroom: 0.10
        slidingWindow: 24h
    memory:
      percentile-hysteresis:
        percentile: 0.93
        headroom: 0.05
        slidingWindow: 24h
    scalingRule: ""

  - name: vhape-policy-p95
    cpu:
      percentile-hysteresis:
        percentile: 0.95
        headroom: 0.10
        slidingWindow: 24h
    memory:
      percentile-hysteresis:
        percentile: 0.95
        headroom: 0.05
        slidingWindow: 24h
    scalingRule: ""

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi