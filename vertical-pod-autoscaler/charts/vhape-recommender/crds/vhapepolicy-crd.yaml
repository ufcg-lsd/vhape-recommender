apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vhapepolicies.autoscaling.vhape.io
spec:
  group: autoscaling.vhape.io
  names:
    kind: VhapePolicy
    listKind: VhapePolicyList
    plural: vhapepolicies
    singular: vhapepolicy
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - jsonPath: .spec.scalingRule
          name: ScalingRule
          type: string
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              x-kubernetes-validations:
                - rule: "self == oldSelf"
                  message: "VhapePolicy spec is immutable; create a new policy and update the VPA annotation"
              required:
                - resources
              properties:
                resources:
                  type: object
                  required:
                    - cpu
                    - memory
                  properties:
                    cpu:
                      type: object
                      minProperties: 1
                      maxProperties: 1
                      properties:
                        percentile-hysteresis:
                          type: object
                          required:
                            - percentile
                            - headroom
                            - slidingWindow
                            - minimumCoverageWindow
                          properties:
                            percentile:
                              type: number
                              minimum: 0
                              maximum: 1
                            headroom:
                              type: number
                              minimum: 0
                            slidingWindow:
                              type: string
                            minimumCoverageWindow:
                              type: string
                    memory:
                      type: object
                      minProperties: 1
                      maxProperties: 1
                      properties:
                        percentile-hysteresis:
                          type: object
                          required:
                            - percentile
                            - headroom
                            - slidingWindow
                            - minimumCoverageWindow
                          properties:
                            percentile:
                              type: number
                              minimum: 0
                              maximum: 1
                            headroom:
                              type: number
                              minimum: 0
                            slidingWindow:
                              type: string
                            minimumCoverageWindow:
                              type: string
                scalingRule:
                  type: string
                  enum:
                    - ""
                    - block-scale-up
                    - block-scale-down