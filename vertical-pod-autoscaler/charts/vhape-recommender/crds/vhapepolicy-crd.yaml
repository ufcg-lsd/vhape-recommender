apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vhapepolicies.autoscaling.vhape.io
spec:
  group: autoscaling.vhape.io
  names:
    kind: VhapePolicy
    listKind: VhapePolicyList
    plural: vhapepolicies
    singular: vhapepolicy
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              x-kubernetes-validations:
                - rule: "self == oldSelf"
                  message: "VhapePolicy spec is immutable; create a new policy and update the VPA annotation"
              required:
                - resources
              properties:
                resources:
                  type: object
                  required:
                    - cpu
                    - memory
                  properties:
                    cpu:
                      type: object
                      required:
                        - scalingHeuristic
                      properties:
                        scalingHeuristic:
                          type: object
                          minProperties: 1
                          maxProperties: 1
                          properties:
                            percentile-hysteresis:
                              type: object
                              required:
                                - percentile
                                - headroom
                                - slidingWindow
                                - minimumCoverageWindow
                              properties:
                                percentile:
                                  type: number
                                  minimum: 0
                                  maximum: 1
                                headroom:
                                  type: number
                                  minimum: 0
                                slidingWindow:
                                  type: string
                                minimumCoverageWindow:
                                  type: string
                        scalingRules:
                          type: array
                          items:
                            type: object
                            minProperties: 1
                            maxProperties: 1
                            properties:
                              request-ceiling:
                                type: object
                                required:
                                  - maximum
                                properties:
                                  maximum:
                                    type: string
                                    pattern: '^[0-9]+(\.[0-9]+)?%$'
                              request-floor:
                                type: object
                                required:
                                  - minimum
                                properties:
                                  minimum:
                                    type: string
                                    pattern: '^[0-9]+(\.[0-9]+)?%$'
                    memory:
                      type: object
                      required:
                        - scalingHeuristic
                      properties:
                        scalingHeuristic:
                          type: object
                          minProperties: 1
                          maxProperties: 1
                          properties:
                            percentile-hysteresis:
                              type: object
                              required:
                                - percentile
                                - headroom
                                - slidingWindow
                                - minimumCoverageWindow
                              properties:
                                percentile:
                                  type: number
                                  minimum: 0
                                  maximum: 1
                                headroom:
                                  type: number
                                  minimum: 0
                                slidingWindow:
                                  type: string
                                minimumCoverageWindow:
                                  type: string
                        scalingRules:
                          type: array
                          items:
                            type: object
                            minProperties: 1
                            maxProperties: 1
                            properties:
                              request-ceiling:
                                type: object
                                required:
                                  - maximum
                                properties:
                                  maximum:
                                    type: string
                                    pattern: '^[0-9]+(\.[0-9]+)?%$'
                              request-floor:
                                type: object
                                required:
                                  - minimum
                                properties:
                                  minimum:
                                    type: string
                                    pattern: '^[0-9]+(\.[0-9]+)?%$'
