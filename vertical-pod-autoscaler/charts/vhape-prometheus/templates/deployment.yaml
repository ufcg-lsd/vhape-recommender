apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vhape-prometheus.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vhape-prometheus.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: {{ if .Values.storage.enabled }}Recreate{{ else }}RollingUpdate{{ end }}
  selector:
    matchLabels:
      {{- include "vhape-prometheus.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vhape-prometheus.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "vhape-prometheus.fullname" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time={{ .Values.retention }}"
          ports:
            - containerPort: 9090
              name: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 15
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: {{ include "vhape-prometheus.fullname" . }}
        {{- if .Values.storage.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "vhape-prometheus.fullname" . }}
        {{- else }}
        - name: data
          emptyDir: {}
        {{- end }}
