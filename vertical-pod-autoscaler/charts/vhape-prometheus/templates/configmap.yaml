apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vhape-prometheus.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vhape-prometheus.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.scrape.stateInterval }}
      scrape_timeout: 10s
      evaluation_interval: 30s

    rule_files: []

    scrape_configs:

      - job_name: prometheus
        scrape_interval: {{ .Values.scrape.stateInterval }}
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: kubernetes-cadvisor
        scrape_interval: {{ .Values.scrape.resourceInterval }}
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        metrics_path: /metrics/resource
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - source_labels: [__meta_kubernetes_node_address_InternalIP]
            target_label: __address__
            replacement: $1:10250
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: container_cpu_usage_seconds_total|container_memory_working_set_bytes
            action: keep

      - job_name: cadvisor
        scrape_interval: {{ .Values.scrape.resourceInterval }}
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        metrics_path: /metrics/cadvisor
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - source_labels: [__meta_kubernetes_node_address_InternalIP]
            target_label: __address__
            replacement: $1:10250
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: container_cpu_cfs_throttled_periods_total|container_cpu_cfs_periods_total|container_pressure_cpu_waiting_seconds_total|container_pressure_memory_waiting_seconds_total
            action: keep
          - source_labels: [pod]
            regex: ^$
            action: drop

      - job_name: kubelet-probes
        scrape_interval: {{ .Values.scrape.stateInterval }}
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        metrics_path: /metrics/probes
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_address_InternalIP]
            target_label: __address__
            replacement: $1:10250
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: prober_probe_total
            action: keep

      - job_name: kube-state-metrics
        scrape_interval: {{ .Values.scrape.stateInterval }}
        honor_labels: true
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                {{- range .Values.serviceDiscoveryNamespaces }}
                - {{ . }}
                {{- end }}
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_service_label_app_kubernetes_io_name
            regex: kube-state-metrics
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: http-metrics|http
            action: keep
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: kube_pod_owner|kube_replicaset_owner|kube_job_owner|kube_pod_info|kube_pod_status_phase|kube_pod_status_reason|kube_pod_container_info|kube_pod_container_resource_requests|kube_pod_container_resource_limits|kube_pod_container_status_restarts_total|kube_pod_container_status_last_terminated_reason|kube_deployment_spec_replicas|kube_deployment_status_replicas_ready|kube_deployment_status_replicas_unavailable|kube_deployment_metadata_generation|kube_statefulset_replicas|kube_statefulset_status_replicas_ready|kube_statefulset_metadata_generation|kube_daemonset_status_desired_number_scheduled|kube_daemonset_status_number_ready|kube_daemonset_status_number_unavailable|kube_daemonset_metadata_generation|kube_horizontalpodautoscaler_spec_min_replicas|kube_horizontalpodautoscaler_spec_max_replicas|kube_horizontalpodautoscaler_status_desired_replicas|kube_node_status_allocatable|kube_node_status_condition|kube_node_labels
            action: keep

      - job_name: node-exporter
        scrape_interval: {{ .Values.scrape.stateInterval }}
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                {{- range .Values.serviceDiscoveryNamespaces }}
                - {{ . }}
                {{- end }}
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_service_label_app_kubernetes_io_name
            regex: (prometheus-)?node-exporter
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: metrics|http-metrics
            action: keep
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: node_cpu_seconds_total|node_memory_MemAvailable_bytes|node_memory_MemTotal_bytes|node_pressure_cpu_waiting_seconds_total|node_pressure_memory_waiting_seconds_total|node_vmstat_oom_kill
            action: keep
