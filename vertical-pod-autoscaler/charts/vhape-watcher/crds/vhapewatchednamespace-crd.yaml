apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vhapewatchednamespaces.autoscaling.vhape.io
spec:
  group: autoscaling.vhape.io
  scope: Cluster
  names:
    plural: vhapewatchednamespaces
    singular: vhapewatchednamespace
    kind: VhapeWatchedNamespace
    listKind: VhapeWatchedNamespaceList
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - jsonPath: .spec.vhapePolicyName
          name: PolicyName
          type: string
        - jsonPath: .spec.vpaUpdateMode
          name: UpdateMode
          type: string
      schema:
        openAPIV3Schema:
          type: object
          description: Marks a Kubernetes namespace as eligible for VHAPE Watcher management.
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - vhapePolicyName
                - vpaUpdateMode
              properties:
                vhapePolicyName:
                  type: string
                  minLength: 1
                vpaUpdateMode:
                  type: string
                  enum:
                    - Off
                    - Initial
                    - Recreate
                    - InPlaceOrRecreate
