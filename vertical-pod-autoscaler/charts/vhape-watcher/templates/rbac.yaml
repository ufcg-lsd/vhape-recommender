apiVersion: v1
kind: ServiceAccount
metadata:
  name: vhape-watcher
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vhape-watcher
rules:
  # Deployments watched by VHAPE Watcher.
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch

  # VPA objects created and maintained by VHAPE Watcher.
  - apiGroups:
      - autoscaling.k8s.io
    resources:
      - verticalpodautoscalers
    verbs:
      - get
      - list
      - watch
      - create
      - delete

  # VHAPE Watcher configuration CRDs.
  - apiGroups:
      - autoscaling.vhape.io
    resources:
      - vhapewatchednamespaces
      - vhapewatchednamespaceregexes
      - vhapeignorednamespaces
      - vhapeignoredworkloads
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vhape-watcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vhape-watcher
subjects:
  - kind: ServiceAccount
    name: vhape-watcher
    namespace: {{ .Release.Namespace }}