apiVersion: apps/v1
kind: Deployment
metadata:
  name: vhape-watcher
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vhape-watcher
  template:
    metadata:
      labels:
        app: vhape-watcher
    spec:
      serviceAccountName: vhape-watcher
      containers:
        - name: vhape-watcher
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /vhape-watcher
          args:
            - --workers={{ .Values.config.workers }}
            - --kube-api-qps={{ .Values.config.kubeApiQps }}
            - --kube-api-burst={{ .Values.config.kubeApiBurst }}
            - --recommender-name={{ .Values.config.recommenderName }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}