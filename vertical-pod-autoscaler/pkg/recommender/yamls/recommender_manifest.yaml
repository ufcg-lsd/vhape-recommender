apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vpa-vanilla
  namespace: vendor-jwpepper
spec:
  recommenders:
    - name: custom-recommender
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: jwpepper-givex-1-0-5-a8885dbdf9ccf3d
  updatePolicy:
    updateMode: "Recreate"  # Off, Initial, Recreate, InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
    - containerName: "*"
      controlledValues: RequestsOnly