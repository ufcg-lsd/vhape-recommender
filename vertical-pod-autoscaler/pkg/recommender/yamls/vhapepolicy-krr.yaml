# VhapePolicy com perfil próximo ao KRR (Kubernetes Resource Report):
# CPU no percentil alto (P95) e memória no máximo observado na janela (P100).
# O VPA deve referenciar esta policy com: metadata.annotations["vhape/policy"]: "krr"
apiVersion: autoscaling.vhape.io/v1alpha1
kind: VhapePolicy
metadata:
  # Nome usado na annotation vhape/policy do VerticalPodAutoscaler
  name: krr
  # Policies são lidas do kube-system pelo recommender (ver FetchVhapePolicy)
  namespace: kube-system
spec:
  # percentil + histerese sobre amostras em janela de 24h (métricas atuais dos pods).
  # A heurística "p95-max-memory" no CRD ainda usa o mesmo estimador até existir krr_estimator.go.
  heuristic: "percentile-hysteresis"
  cpu:
    # P95 do uso de CPU na janela (0.95 = 95º percentil)
    percentile: 0.95
    # Banda de histerese: só ajusta o target se o novo percentil sair de ±20% em relação ao anterior
    headroom: 0.20
    # Lower/upper bound do objeto VPA em torno do target (10% abaixo / 10% acima)
    lowerBound: 0.10
    upperBound: 0.10
  memory:
    # P100 = máximo na janela (equivalente a “max” no relatório KRR)
    percentile: 1.00
    headroom: 0.20
    lowerBound: 0.10
    upperBound: 0.10
  # Vazio = sem restrição extra; use "scale-down-only" ou "scale-up-only" se precisar
  scalingRule: ""
