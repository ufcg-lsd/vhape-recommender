apiVersion: apps/v1
kind: Deployment
metadata:
  # Name of the custom recommender Deployment
  name: vhape-recommender
  # Namespace where the recommender runs
  namespace: kube-system
spec:
  # Single replica because the recommender is stateful and keeps metrics history
  replicas: 1
  selector:
    matchLabels:
      app: vhape-recommender
  template:
    metadata:
      labels:
        app: vhape-recommender
    spec:
      # ServiceAccount with the permissions required by the VPA recommender
      serviceAccountName: vhape-recommender
      containers:
        - name: vhape-recommender
          # Recommender image with the VHAPE framework
          image: brunogb123/vhape-recommender:latest
          command:
            - /recommender
          args:
            # Registers this recommender using the name referenced by VPA objects
            - --recommender-name=vhape-recommender