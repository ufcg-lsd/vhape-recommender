apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vhapepolicies.autoscaling.vhape.io
spec:
  type: object
  required:
    - resources
  properties:
    resources:
      type: object
      required:
        - cpu
        - memory
      properties:
        cpu:
          type: object
          minProperties: 1
          maxProperties: 1
          properties:
            percentile-hysteresis:
              type: object
              required:
                - percentile
                - headroom
                - slidingWindow
              properties:
                percentile:
                  type: number
                  minimum: 0
                  maximum: 1
                headroom:
                  type: number
                  minimum: 0
                slidingWindow:
                  type: string
        memory:
          type: object
          minProperties: 1
          maxProperties: 1
          properties:
            percentile-hysteresis:
              type: object
              required:
                - percentile
                - headroom
                - slidingWindow
              properties:
                percentile:
                  type: number
                  minimum: 0
                  maximum: 1
                headroom:
                  type: number
                  minimum: 0
                slidingWindow:
                  type: string
    scalingRule:
      type: string
      enum:
        - ""
        - scale-up-only
        - scale-down-only