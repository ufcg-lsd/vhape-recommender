apiVersion: v1
kind: ServiceAccount
metadata:
  name: vhape-recommender
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  # Role that grants read access to VhapePolicy resources
  name: vhapepolicy-reader
rules:
  - apiGroups:
      # API group where the VhapePolicy CRD is registered
      - autoscaling.vhape.io
    resources:
      - vhapepolicies
    verbs:
      # Minimum permissions required for the recommender to fetch and watch policies
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  # Binds the role above to the recommender ServiceAccount
  name: vhape-recommender-vhapepolicy-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vhapepolicy-reader
subjects:
  - kind: ServiceAccount
    # ServiceAccount used by the recommender pod
    name: vhape-recommender
    namespace: kube-system
  