apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vhape-vpa-object
  namespace: default
  annotations:
    # Reference to the VhapePolicy used to calculate recommendations
    vhape/policy: "kube-system/vhape-policy-p93-default"
spec:
  recommenders:
    # Delegates recommendations to the custom recommender instead of the default VPA recommender
    - name: vhape-recommender
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    # Target Deployment whose pods will have their resources adjusted
    name: my-app
  updatePolicy:
    # Recreates pods to apply new resource recommendations
    updateMode: "Recreate"
  resourcePolicy:
    containerPolicies:
      # Applies the policy to all containers in the pod
      - containerName: "*"
        # Controls requests only, not limits
        controlledValues: RequestsOnly