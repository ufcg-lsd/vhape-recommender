# VhapePolicy used to compare VHAPE with Tiny Autoscalers.
# CPU: the sma heuristic with Tiny's serverless-recommender parameters, Predict_SMA(N=3, input=2).
# Memory: Tiny keeps the VPA percentile estimator for memory; an empty vpa block uses the VPA defaults, which match it.
apiVersion: autoscaling.vhape.io/v1alpha1
kind: VhapePolicy
metadata:
  name: sma-policy
spec:
  resources:
    cpu:
      scalingHeuristic:
        sma:
          "N": 3
          input: 2
    memory:
      scalingHeuristic:
        vpa: {}
